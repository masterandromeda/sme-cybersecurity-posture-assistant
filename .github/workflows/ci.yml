name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  # ── Frontend ────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend — TypeScript + Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Next.js build
        run: npx next build

  # ── Backend ─────────────────────────────────────────────────────────────────
  backend:
    name: Backend — Python lint + import check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd backend
          pip install -e ".[dev]"

      - name: Check imports (no syntax errors)
        run: |
          cd backend
          python -c "from app.main import app; print('Backend imports OK')"
        env:
          DATABASE_URL: sqlite+aiosqlite:///./test.db
          API_SECRET_KEY: ci-test-key
          CORS_ORIGINS: http://localhost:3000
